name: Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            package_ext: tar.xz
            output_name: QmClient-ubuntu.tar.xz
            artifact_name: packaged-linux
          - name: Windows
            os: windows-2022
            package_ext: zip
            output_name: QmClient-windows.zip
            artifact_name: packaged-windows
          - name: macOS
            os: macos-26
            package_ext: dmg
            output_name: QmClient-macOS.dmg
            artifact_name: packaged-macos

    steps:
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG_VERSION" =~ ^[vV][0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid tag format: $TAG_VERSION"
            echo "Expected format: v1.2 or v1.2.3"
            exit 1
          fi
          echo "Tag version: $TAG_VERSION"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          python3 qmclient_scripts/bump_version.py --tag "$TAG_VERSION"
          echo "Updated version files:"
          grep "QMCLIENT_VERSION" src/game/version.h

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: |
            build/_deps
          key: cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-

      - name: Cache Homebrew packages
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: Reinstall ccache (macOS)
        if: runner.os == 'macOS'
        run: brew reinstall ccache

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          max-size: 500M

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC tools was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
              }
            }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config python3 python3-pip python3-pil \
            libfreetype6-dev libnotify-dev libsdl2-dev libsqlite3-dev \
            libgl1-mesa-dev \
            libvulkan-dev glslang-tools spirv-tools \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libx264-dev \
            libpng-dev libcurl4-openssl-dev libssl-dev \
            libogg-dev libopus-dev libopusfile-dev libwavpack-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          for pkg in cmake ninja pkg-config python freetype sdl2 libpng libogg opus opusfile sqlite wavpack ffmpeg molten-vk vulkan-loader glslang; do
            if brew list --formula "$pkg" &>/dev/null; then
              brew link --overwrite "$pkg" 2>/dev/null || true
            else
              brew install "$pkg"
            fi
          done

      - name: Install Python build dependencies
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "${PYTHON_EXECUTABLE}" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            "${PYTHON_EXECUTABLE}" -m pip install dmgbuild==1.6.7 Pillow==12.3.0
          else
            "${PYTHON_EXECUTABLE}" -m pip install Pillow==12.3.0
          fi

      - name: Configure
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDOWNLOAD_GTEST=ON -DPython3_EXECUTABLE="${PYTHON_EXECUTABLE}")
          case "$RUNNER_OS" in
            Linux)
              # Rust doctests link the C++ bridge through lld. GCC LTO objects
              # in rust_test are not consumable by that linker.
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=ccache
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                -DIPO=OFF
              )
              ;;
            macOS)
              SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                -DPREFER_BUNDLED_LIBS=ON -DVULKAN=ON
                -DCMAKE_OSX_SYSROOT="${SDKROOT}" -DIPO=OFF
              )
              ;;
            Windows)
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                -DPREFER_BUNDLED_LIBS=ON -DCMAKE_OBJECT_PATH_MAX=1024
                -DQM_MSVC_USE_EMBEDDED_DEBUG_INFO=ON
              )
              ;;
          esac
          cmake -S . -B build "${ARGS[@]}"

      - name: Build client
        shell: bash
        run: cmake --build build --target game-client --parallel

      - name: Run tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests == 'true') }}
        shell: bash
        run: cmake --build build --target run_tests --parallel

      - name: Package
        shell: bash
        run: cmake --build build --target package_default --parallel

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            found=false
            for ext in zip 7z; do
              pkg="$(find build -type f -name "QmClient*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              [ -z "$pkg" ] && pkg="$(find build -type f -name "*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              if [ -n "$pkg" ]; then
                cp "$pkg" "dist/QmClient-windows.$ext"
                echo "Found: $pkg -> dist/QmClient-windows.$ext"
                found=true
              fi
            done
            if [ "$found" = "false" ]; then
              echo "No zip or 7z package found under build/"
              exit 1
            fi
          else
            PKG="$(find build -type f -name "*.${{ matrix.package_ext }}" ! -name "*-src*" | head -n 1)"
            if [ -z "$PKG" ]; then
              echo "No package with extension .${{ matrix.package_ext }} found under build/"
              exit 1
            fi
            cp "$PKG" "dist/${{ matrix.output_name }}"
          fi
          ls -lah dist

      - name: Verify Windows update package contents
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          package = Path("dist/QmClient-windows.zip")
          required = {"DDNet.exe", "DDNet-Server.exe", "QmClient-Updater.exe"}
          with zipfile.ZipFile(package) as archive:
              basenames = [Path(name).name for name in archive.namelist() if not name.endswith("/")]
          missing = sorted(name for name in required if basenames.count(name) != 1)
          if missing:
              raise SystemExit(f"Windows package is missing or duplicates required files: {missing}")
          print("Verified Windows automatic update executables")
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            shopt -s nullglob
            for file in dist/*; do
              size=$(stat -c%s "$file")
              if [ "$size" -lt 1000000 ]; then
                echo "Artifact too small: $file ($size bytes)"
                exit 1
              fi
              echo "Verified: $file ($size bytes)"
            done
          else
            artifact="dist/${{ matrix.output_name }}"
            if [ ! -f "$artifact" ]; then
              echo "Build artifact not found!"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              size=$(stat -f%z "$artifact")
            else
              size=$(stat -c%s "$artifact")
            fi
            if [ "$size" -lt 1000000 ]; then
              echo "Build artifact too small: $size bytes"
              exit 1
            fi
            echo "Build artifact verified: $size bytes"
          fi

      - name: Verify macOS DMG contents
        if: runner.os == 'macOS'
        shell: bash
        run: qmclient_scripts/verify_macos_dmg.sh "dist/${{ matrix.output_name }}"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: ${{ matrix.name }}"
            echo "- **OS**: ${{ matrix.os }}"
            echo "- **Build Type**: ${{ env.BUILD_TYPE }}"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "- **Artifacts**: QmClient-windows.zip, QmClient-windows.7z" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Artifact**: ${{ matrix.output_name }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show ccache statistics (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats || true

  build_android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_APP_NAME: QmClient
      ANDROID_PACKAGE_NAME: com.qmclient.client
      ANDROID_BUILD_DIR: build-android-release
      ANDROID_NDK_VERSION: "26.1.10909125"
      CARGO_NDK_VERSION: "4.1.2"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          python3 qmclient_scripts/bump_version.py --tag "$TAG_VERSION"
          echo "Updated version files:"
          grep "QMCLIENT_VERSION" src/game/version.h

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Setup ccache (Android)
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: android-${{ runner.os }}
          max-size: 500M

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/sdk/ndk
            ~/.android/sdk/platforms
            ~/.android/sdk/build-tools
          key: android-sdk-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Rust Android targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-android-${{ runner.os }}-

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl python3 python3-pip python3-pil \
            glslang-tools spirv-tools ccache
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          fi
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"
          yes | sdkmanager --licenses

      - name: Prepare Android signing keystore
        shell: bash
        env:
          QM_ANDROID_KEYSTORE_BASE64: ${{ secrets.QM_ANDROID_KEYSTORE_BASE64 }}
          QM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QM_ANDROID_KEYSTORE_PASSWORD }}
          QM_ANDROID_KEY_ALIAS: ${{ secrets.QM_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            for variable in QM_ANDROID_KEYSTORE_BASE64 QM_ANDROID_KEYSTORE_PASSWORD QM_ANDROID_KEY_ALIAS; do
              if [ -z "${!variable}" ]; then
                echo "Required Android release secret ${variable} is not configured"
                exit 1
              fi
            done
            TW_KEY_NAME="${RUNNER_TEMP}/qmclient-release.jks"
            printf '%s' "${QM_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${TW_KEY_NAME}"
            TW_KEY_PW="${QM_ANDROID_KEYSTORE_PASSWORD}"
            TW_KEY_ALIAS="${QM_ANDROID_KEY_ALIAS}"
          else
            TW_KEY_NAME="${HOME}/.android/debug.keystore"
            TW_KEY_PW=android
            TW_KEY_ALIAS=androiddebugkey
            mkdir -p "$(dirname "${TW_KEY_NAME}")"
            if [ ! -f "${TW_KEY_NAME}" ]; then
              keytool -genkeypair -v \
                -keystore "${TW_KEY_NAME}" \
                -storepass "${TW_KEY_PW}" \
                -keypass "${TW_KEY_PW}" \
                -alias "${TW_KEY_ALIAS}" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=GitHub Actions, OU=CI, O=QmClient, L=Unknown, ST=Unknown, C=US"
            fi
          fi
          {
            echo "TW_KEY_NAME=${TW_KEY_NAME}"
            echo "TW_KEY_PW=${TW_KEY_PW}"
            echo "TW_KEY_ALIAS=${TW_KEY_ALIAS}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK/AAB
        shell: bash
        run: |
          chmod +x scripts/android/cmake_android.sh
          scripts/android/cmake_android.sh all "${ANDROID_APP_NAME}" "${ANDROID_PACKAGE_NAME}" Release "${ANDROID_BUILD_DIR}"

      - name: Collect Android package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.apk" dist/QmClient-android.apk
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.aab" dist/QmClient-android.aab
          ls -lah dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: packaged-android
          path: |
            dist/QmClient-android.apk
            dist/QmClient-android.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifacts
        run: |
          for file in dist/QmClient-android.apk dist/QmClient-android.aab; do
            if [ ! -f "$file" ]; then
              echo "Build artifact not found: $file"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$file")
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Build artifact too small: $file ($FILE_SIZE bytes)"
              exit 1
            fi
            echo "Verified: $file ($FILE_SIZE bytes)"
          done

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: Android"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Artifacts**: QmClient-android.apk, QmClient-android.aab"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show ccache statistics (Android)
        if: always()
        run: ccache --show-stats || true

  release-desktop:
    name: Publish Desktop Release
    runs-on: ubuntu-24.04
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Prepare Windows update signing environment
        run: |
          set -euo pipefail
          python3 -m venv .update-signing-venv
          .update-signing-venv/bin/python -m pip install cryptography==45.0.6

      - name: Sign Windows automatic update assets
        env:
          QM_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.QM_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QM_UPDATE_ED25519_PRIVATE_KEY}" ]; then
            echo "Required secret QM_UPDATE_ED25519_PRIVATE_KEY is not configured"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          .update-signing-venv/bin/python qmclient_scripts/sign_update_release.py \
            --package release-assets/QmClient-windows.zip \
            --version "${TAG_VERSION}" \
            --private-key-env QM_UPDATE_ED25519_PRIVATE_KEY \
            --normalize-package \
            --output-dir release-assets

      - name: Generate release notes
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          python3 qmclient_scripts/generate_release_notes.py \
            --version "$TAG_VERSION" \
            --current-tag "$TAG_VERSION" \
            --output release-assets/release-notes.md

      - name: Show release notes
        run: cat release-assets/release-notes.md

      - name: Create release and upload desktop assets
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-assets/release-notes.md
          files: |
            release-assets/QmClient-windows.zip
            release-assets/QmClient-windows.zip.sig
            release-assets/QmClient-windows-update.json
            release-assets/QmClient-windows-update.json.sig
            release-assets/QmClient-windows.7z
            release-assets/QmClient-ubuntu.tar.xz
            release-assets/QmClient-macOS.dmg

  release-android:
    name: Publish Android Release
    runs-on: ubuntu-24.04
    needs:
      - build_android
      - release-desktop
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          name: packaged-android
          path: release-assets

      - name: List release assets
        run: ls -lah release-assets

      - name: Upload Android assets to release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          generate_release_notes: false
          files: |
            release-assets/QmClient-android.apk
            release-assets/QmClient-android.aab
