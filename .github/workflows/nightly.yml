name: Nightly Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check Nightly Changes
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.nightly.outputs.should_build }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check nightly tag
        id: nightly
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual nightly run; publishing is allowed."
            exit 0
          fi

          current="${GITHUB_SHA}"
          previous="$(git ls-remote --tags origin refs/tags/nightly | awk '{print $1}')"
          if [ -n "$previous" ] && [ "$previous" = "$current" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled nightly skipped: refs/tags/nightly already points at ${current}."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled nightly will publish: previous=${previous:-<none>} current=${current}."
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
      - changes
    if: needs.changes.outputs.should_build == 'true'
    timeout-minutes: 120
    env:
      BUILD_TYPE: Release
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            package_ext: tar.xz
            output_name: QmClient-ubuntu.tar.xz
            artifact_name: nightly-linux
          - name: Windows
            os: windows-2022
            package_ext: zip
            output_name: QmClient-windows.zip
            artifact_name: nightly-windows
          - name: macOS
            os: macos-26
            package_ext: dmg
            output_name: QmClient-macOS.dmg
            artifact_name: nightly-macos

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: |
            build/_deps
          key: nightly-cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: nightly-cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-

      - name: Cache Homebrew packages
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: nightly-homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/nightly.yml') }}
          restore-keys: nightly-homebrew-${{ runner.os }}-

      - name: Reinstall ccache (macOS)
        if: runner.os == 'macOS'
        run: brew reinstall ccache

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: nightly-${{ runner.os }}-${{ runner.arch }}
          max-size: 500M

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC tools was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
              }
            }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config python3 python3-pip python3-pil \
            libfreetype6-dev libnotify-dev libsdl2-dev libsqlite3-dev \
            libgl1-mesa-dev \
            libvulkan-dev glslang-tools spirv-tools \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libx264-dev \
            libpng-dev libwebp-dev libcurl4-openssl-dev libssl-dev \
            libogg-dev libopus-dev libopusfile-dev libwavpack-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          for pkg in cmake ninja pkg-config python freetype sdl2 libpng webp libogg opus opusfile sqlite wavpack ffmpeg molten-vk vulkan-loader glslang; do
            if brew list --formula "$pkg" &>/dev/null; then
              brew link --overwrite "$pkg" 2>/dev/null || true
            else
              brew install "$pkg"
            fi
          done

      - name: Install Python build dependencies
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "${PYTHON_EXECUTABLE}" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            "${PYTHON_EXECUTABLE}" -m pip install dmgbuild Pillow
          else
            "${PYTHON_EXECUTABLE}" -m pip install Pillow
          fi

      - name: Configure
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DDOWNLOAD_GTEST=ON -DPython3_EXECUTABLE="${PYTHON_EXECUTABLE}")
          case "$RUNNER_OS" in
            Linux)
              ARGS+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
              ;;
            macOS)
              SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                -DPREFER_BUNDLED_LIBS=ON -DVULKAN=ON
                -DCMAKE_OSX_SYSROOT="${SDKROOT}" -DIPO=OFF
              )
              ;;
            Windows)
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                -DPREFER_BUNDLED_LIBS=ON -DCMAKE_OBJECT_PATH_MAX=1024
                -DQM_MSVC_USE_EMBEDDED_DEBUG_INFO=ON
              )
              ;;
          esac
          cmake -S . -B build "${ARGS[@]}"

      - name: Build client
        shell: bash
        run: cmake --build build --target game-client --parallel

      - name: Run tests
        shell: bash
        run: cmake --build build --target run_tests --parallel

      - name: Package
        shell: bash
        run: cmake --build build --target package_default --parallel

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            found=false
            for ext in zip 7z; do
              pkg="$(find build -type f -name "QmClient*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              [ -z "$pkg" ] && pkg="$(find build -type f -name "*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              if [ -n "$pkg" ]; then
                cp "$pkg" "dist/QmClient-windows.$ext"
                echo "Found: $pkg -> dist/QmClient-windows.$ext"
                found=true
              fi
            done
            if [ "$found" = "false" ]; then
              echo "No zip or 7z package found under build/"
              exit 1
            fi
          else
            PKG="$(find build -type f -name "*.${{ matrix.package_ext }}" ! -name "*-src*" | head -n 1)"
            if [ -z "$PKG" ]; then
              echo "No package with extension .${{ matrix.package_ext }} found under build/"
              exit 1
            fi
            cp "$PKG" "dist/${{ matrix.output_name }}"
          fi
          ls -lah dist

      - name: Reject PDB files in packages
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*; do
            case "$file" in
              *.zip)
                if unzip -Z1 "$file" | grep -E '\.pdb$'; then
                  echo "PDB files must not be published: $file"
                  exit 1
                fi
                ;;
              *.7z)
                if 7z l "$file" | grep -E '\.pdb$'; then
                  echo "PDB files must not be published: $file"
                  exit 1
                fi
                ;;
              *.tar.xz)
                if tar -tf "$file" | grep -E '\.pdb$'; then
                  echo "PDB files must not be published: $file"
                  exit 1
                fi
                ;;
              *.dmg)
                echo "Skipping archive listing for DMG: $file"
                ;;
            esac
          done

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in dist/*; do
            if [ "$RUNNER_OS" = "macOS" ]; then
              size=$(stat -f%z "$file")
            else
              size=$(stat -c%s "$file")
            fi
            if [ "$size" -lt 1000000 ]; then
              echo "Artifact too small: $file ($size bytes)"
              exit 1
            fi
            echo "Verified: $file ($size bytes)"
          done

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build_android:
    name: Android
    runs-on: ubuntu-24.04
    needs:
      - changes
    if: needs.changes.outputs.should_build == 'true'
    timeout-minutes: 180
    env:
      ANDROID_APP_NAME: QmClient
      ANDROID_PACKAGE_NAME: org.ddnet.client
      ANDROID_BUILD_DIR: build-android-release
      ANDROID_NDK_VERSION: "26.1.10909125"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
      TW_KEY_NAME: /home/runner/.android/debug.keystore
      TW_KEY_PW: android
      TW_KEY_ALIAS: androiddebugkey
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Setup ccache (Android)
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: nightly-android-${{ runner.os }}
          max-size: 500M

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: nightly-cargo-ndk-${{ runner.os }}

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/sdk/ndk
            ~/.android/sdk/platforms
            ~/.android/sdk/build-tools
          key: nightly-android-sdk-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Rust Android targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: nightly-rust-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: nightly-rust-android-${{ runner.os }}-

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl python3 python3-pip python3-pil \
            glslang-tools spirv-tools ccache
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk
          fi
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"
          yes | sdkmanager --licenses

      - name: Cache WebP for Android
        id: cache-webp
        uses: actions/cache@v5
        with:
          path: ddnet-libs/webp/android
          key: nightly-webp-android-v1.6.0-sharpyuv-${{ hashFiles('.github/workflows/nightly.yml', 'ddnet-libs/webp/**') }}
          restore-keys: nightly-webp-android-v1.6.0-sharpyuv-

      - name: Build WebP for Android (Parallel)
        if: steps.cache-webp.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.6.0 https://chromium.googlesource.com/webm/libwebp
          cd libwebp

          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"

          build_abi() {
            local ABI=$1
            local DIR=$2
            mkdir -p "build-android/${ABI}"
            cmake -S . -B "build-android/${ABI}" \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${PWD}/install-${ABI}" \
              -DWEBP_BUILD_ANIM_UTILS=OFF \
              -DWEBP_BUILD_CWEBP=OFF \
              -DWEBP_BUILD_DWEBP=OFF \
              -DWEBP_BUILD_EXTRAS=OFF \
              -DWEBP_BUILD_GIF2WEBP=OFF \
              -DWEBP_BUILD_IMG2WEBP=OFF \
              -DWEBP_BUILD_VWEBP=OFF \
              -DWEBP_BUILD_WEBPINFO=OFF \
              -DWEBP_BUILD_WEBPMUX=OFF \
              -DWEBP_BUILD_WEBP_JS=OFF 2>&1 | tee "build-${ABI}.log"
            cmake --build "build-android/${ABI}" --parallel 2>&1 | tee -a "build-${ABI}.log"
            cmake --install "build-android/${ABI}" 2>&1 | tee -a "build-${ABI}.log"
            echo "Completed ${ABI}"
          }

          build_abi armeabi-v7a libarm &
          build_abi arm64-v8a libarm64 &
          build_abi x86 lib32 &
          build_abi x86_64 lib64 &
          wait

          mkdir -p ../ddnet-libs/webp/include/webp
          cp -r install-arm64-v8a/include/webp/* ../ddnet-libs/webp/include/webp/

          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            case "${ABI}" in
              armeabi-v7a) DIR="libarm" ;;
              arm64-v8a) DIR="libarm64" ;;
              x86) DIR="lib32" ;;
              x86_64) DIR="lib64" ;;
            esac
            mkdir -p "../ddnet-libs/webp/android/${DIR}"
            cp "install-${ABI}/lib/libwebp.a" "../ddnet-libs/webp/android/${DIR}/"
            cp "install-${ABI}/lib/libwebpdemux.a" "../ddnet-libs/webp/android/${DIR}/" 2>/dev/null || true
            cp "install-${ABI}/lib/libwebpmux.a" "../ddnet-libs/webp/android/${DIR}/" 2>/dev/null || true
            cp "install-${ABI}/lib/libsharpyuv.a" "../ddnet-libs/webp/android/${DIR}/" 2>/dev/null || true
          done

          echo "All WebP builds completed"

      - name: Prepare Android signing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${TW_KEY_NAME}")"
          if [ ! -f "${TW_KEY_NAME}" ]; then
            keytool -genkeypair -v \
              -keystore "${TW_KEY_NAME}" \
              -storepass "${TW_KEY_PW}" \
              -keypass "${TW_KEY_PW}" \
              -alias "${TW_KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GitHub Actions, OU=CI, O=QmClient, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Android APK/AAB
        shell: bash
        run: |
          chmod +x scripts/android/cmake_android.sh
          scripts/android/cmake_android.sh all "${ANDROID_APP_NAME}" "${ANDROID_PACKAGE_NAME}" Release "${ANDROID_BUILD_DIR}"

      - name: Collect Android package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.apk" dist/QmClient-android.apk
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.aab" dist/QmClient-android.aab
          ls -lah dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: nightly-android
          path: |
            dist/QmClient-android.apk
            dist/QmClient-android.aab
          if-no-files-found: error
          retention-days: 7

      - name: Verify Android artifacts
        run: |
          for file in dist/QmClient-android.apk dist/QmClient-android.aab; do
            if [ ! -f "$file" ]; then
              echo "Build artifact not found: $file"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$file")
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Build artifact too small: $file ($FILE_SIZE bytes)"
              exit 1
            fi
            echo "Verified: $file ($FILE_SIZE bytes)"
          done

  publish:
    name: Publish Nightly Prerelease
    runs-on: ubuntu-24.04
    needs:
      - changes
      - build
    if: needs.changes.outputs.should_build == 'true' && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: nightly-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Write nightly notes
        shell: bash
        run: |
          {
            echo "# 更新日志"
            echo "> Version: nightly"
            echo "> Commit: ${GITHUB_SHA}"
            echo "> Branch: ${GITHUB_REF_NAME}"
            echo "> Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "##feat."
            echo "- nightly: 这是内部测试构建，包含当前分支的最新提交，可能会被下一次 nightly 构建替换。"
            echo
            echo "## fix"
            echo "- None"
            echo
            echo "# What's Changed"
            echo
            echo "## feat."
            echo "- nightly: Internal testing build for the latest commits on the current branch. It may be replaced by the next nightly run."
            echo
            echo "## fix"
            echo "- None"
          } > release-assets/nightly-notes.md

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete nightly --cleanup-tag --yes || true
          git tag -f nightly "${GITHUB_SHA}"
          git push origin refs/tags/nightly --force
          gh release create nightly \
            release-assets/QmClient-windows.zip \
            release-assets/QmClient-windows.7z \
            release-assets/QmClient-ubuntu.tar.xz \
            release-assets/QmClient-macOS.dmg \
            --title "QmClient Nightly" \
            --notes-file release-assets/nightly-notes.md \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --latest=false

  publish_android:
    name: Publish Android Nightly Assets
    runs-on: ubuntu-24.04
    needs:
      - changes
      - build_android
    if: needs.changes.outputs.should_build == 'true' && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          name: nightly-android
          path: release-assets

      - name: List Android assets
        run: ls -lah release-assets

      - name: Upload Android assets to nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "Nightly release does not exist yet; Android assets will remain as workflow artifacts."
            exit 0
          fi
          gh release upload nightly \
            release-assets/QmClient-android.apk \
            release-assets/QmClient-android.aab \
            --clobber
